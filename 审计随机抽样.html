<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>审计随机抽样工具</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Microsoft YaHei',sans-serif;max-width:900px;margin:0 auto;padding:24px;color:#2c2c2a;background:#f5f5f5}
h1{font-size:22px;margin-bottom:4px}
.sub{color:#888;font-size:13px;margin-bottom:20px}
.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:16px;border:1px solid #e0e0e0}
.card h2{font-size:15px;margin-bottom:10px;color:#185FA5}
input[type=file],select,input[type=number]{padding:8px;border:1px solid #ddd;border-radius:6px;font-size:13px;margin-top:4px}
input[type=file]{width:100%}
label{display:block;font-size:12px;color:#888;margin:8px 0 4px}
button{padding:10px 20px;background:#378ADD;color:#fff;border:none;border-radius:6px;font-size:14px;cursor:pointer;margin-top:12px}
button:hover{background:#185FA5}
.btn-sm{padding:6px 14px;font-size:12px;margin-top:8px;background:#0F6E56}
.btn-sm:hover{background:#085041}
.btn-back{background:#888;margin-top:0;padding:6px 14px;font-size:12px;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th{background:#f0f0f0;padding:8px;text-align:left;font-weight:600;color:#555;border-bottom:2px solid #ddd}
td{padding:7px 8px;border-bottom:1px solid #eee}
.radio-group{display:flex;gap:16px;margin:8px 0;flex-wrap:wrap}
.radio-group label{display:flex;align-items:center;gap:4px;font-size:13px;color:#333;margin:0}
.summary{display:flex;gap:12px;margin:12px 0;flex-wrap:wrap}
.sitem{flex:1;min-width:120px;background:#f8f8f8;padding:12px;border-radius:8px;text-align:center}
.sitem .num{font-size:24px;font-weight:600}
.sitem .lbl{font-size:11px;color:#888}
</style>
</head>
<body>
<button class="btn-back" onclick="location.href='index.html'">← 返回首页</button>
<h1>审计随机抽样工具</h1>
<p class="sub">上传凭证清单 → 选抽样方法 → 一键生成抽样底稿</p>

<div class="card">
  <h2>1. 导入凭证清单</h2>
  <input type="file" id="voucherFile" accept=".csv,.xls,.xlsx">
  <button class="btn-sm" onclick="loadDemo()">加载模拟数据</button>
</div>

<div class="card">
  <h2>2. 抽样设置</h2>
  <div class="radio-group">
    <label><input type="radio" name="method" value="random" checked> 随机抽样</label>
    <label><input type="radio" name="method" value="mus"> 货币单元抽样(MUS)</label>
    <label><input type="radio" name="method" value="top"> 大金额优先</label>
  </div>
  <label>样本数量 <input type="number" id="sampleSize" value="15" min="1" style="width:100px;display:inline;margin-left:8px"></label>
  <button onclick="runSampling()">开始抽样</button>
</div>

<div class="card" id="resultCard" style="display:none">
  <h2>3. 抽样结果</h2>
  <div class="summary" id="summary"></div>
  <div id="detailTable"></div>
  <button onclick="exportExcel()" style="margin-top:12px">导出抽样底稿 Excel</button>
</div>

<script>
let voucherData=[];
const DEMO=`凭证号,日期,摘要,科目,金额,附件张数
记-001,2026-01-05,支付广告服务费,销售费用,45000,3
记-002,2026-01-08,购买办公用品,管理费用,1200,2
记-003,2026-01-10,收到甲公司货款,主营业务收入,85000,2
记-004,2026-01-12,支付供应商货款,应付账款,62000,4
记-005,2026-01-15,缴纳上月增值税,应交税费,42000,1
记-006,2026-01-18,销售人员差旅报销,销售费用,8500,5
记-007,2026-01-20,购买固定资产设备,固定资产,180000,3
记-008,2026-01-22,支付办公室房租,管理费用,36000,2
记-009,2026-01-25,参加行业展会费用,销售费用,32000,4
记-010,2026-01-28,客户招待费,销售费用,3200,3
记-011,2026-02-01,宣传品印刷费,销售费用,12000,2
记-012,2026-02-03,收到乙公司服务费,主营业务收入,48000,2
记-013,2026-02-05,支付银行手续费,财务费用,500,1
记-014,2026-02-08,采购原材料,原材料,95000,5
记-015,2026-02-10,代发员工工资,应付职工薪酬,120000,1
记-016,2026-02-12,收到丙公司预付款,预收账款,200000,2
记-017,2026-02-15,报销差旅费,管理费用,5600,4
记-018,2026-02-18,支付软件服务费,管理费用,28000,2
记-019,2026-02-20,购买低值易耗品,管理费用,1800,2
记-020,2026-02-22,支付运输费,销售费用,9500,3`;

function parseCSV(csv){const l=csv.trim().split('\n'),h=l[0].split(',').map(x=>x.trim());return l.slice(1).map(r=>{const v=r.split(','),o={};h.forEach((x,i)=>o[x]=(v[i]||'').trim());return o})}
function parseExcel(data){const wb=XLSX.read(data,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]],json=XLSX.utils.sheet_to_json(ws,{header:1}),h=json[0].map(x=>String(x||'').trim());return json.slice(1).filter(r=>r.length>0).map(r=>{const o={};h.forEach((x,i)=>o[x]=String(r[i]||'').trim());return o})}

document.getElementById('voucherFile').addEventListener('change',function(e){
  const f=e.target.files[0],r=new FileReader();
  r.onload=ev=>{voucherData=f.name.endsWith('.csv')?parseCSV(ev.target.result):parseExcel(ev.target.result);alert(`已导入 ${voucherData.length} 条凭证`)}
  f.name.endsWith('.csv')?r.readAsText(f):r.readAsArrayBuffer(f);
});

function loadDemo(){voucherData=parseCSV(DEMO);alert(`已加载模拟数据：${voucherData.length} 条凭证`)}

function runSampling(){
  if(!voucherData.length){alert('请先导入凭证数据');return}
  const method=document.querySelector('input[name=method]:checked').value;
  const n=parseInt(document.getElementById('sampleSize').value);
  let samples=[];

  if(method==='random'){
    const indices=[...Array(voucherData.length).keys()];
    for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}
    samples=indices.slice(0,n).map(i=>({...voucherData[i],idx:i+1,method:'随机抽样'}));
  }else if(method==='top'){
    const sorted=[...voucherData].sort((a,b)=>{
      const aa=parseFloat(a['金额']||a['amount']||0),bb=parseFloat(b['金额']||b['amount']||0);
      return bb-aa;
    });
    samples=sorted.slice(0,n).map(r=>({...r,method:'大金额'}));
  }else if(method==='mus'){
    const total=voucherData.reduce((s,r)=>s+(parseFloat(r['金额']||r['amount']||0)||0),0);
    const interval=total/n;
    let start=Math.random()*interval,acc=0;
    const used=new Set();
    voucherData.forEach((r,i)=>{acc+=(parseFloat(r['金额']||r['amount']||0)||0);if(acc>=start&&!used.has(i)){used.add(i);samples.push({...r,idx:i+1,method:'MUS'});start+=interval}});
    samples=samples.slice(0,n);
  }

  const totalAmt=voucherData.reduce((s,r)=>s+(parseFloat(r['金额']||r['amount']||0)||0),0);
  const sampleAmt=samples.reduce((s,r)=>s+(parseFloat(r['金额']||r['amount']||0)||0),0);

  document.getElementById('summary').innerHTML=`
    <div class="sitem"><div class="num">${voucherData.length}</div><div class="lbl">总体数量</div></div>
    <div class="sitem"><div class="num">${samples.length}</div><div class="lbl">样本数量</div></div>
    <div class="sitem"><div class="num">${(totalAmt/10000).toFixed(1)}万</div><div class="lbl">总体金额</div></div>
    <div class="sitem"><div class="num" style="color:#185FA5">${(sampleAmt/totalAmt*100).toFixed(1)}%</div><div class="lbl">金额覆盖率</div></div>`;

  let html=`<table><tr><th>序号</th><th>凭证号</th><th>日期</th><th>摘要</th><th style="text-align:right">金额</th><th>科目</th><th>附件张数</th><th>抽样方法</th></tr>`;
  samples.forEach((r,i)=>html+=`<tr><td>${r.idx||i+1}</td><td>${r['凭证号']||r['voucher_no']}</td><td>${r['日期']||r['date']}</td><td>${r['摘要']||r['description']}</td><td style="text-align:right">${(parseFloat(r['金额']||r['amount']||0)).toFixed(2)}</td><td>${r['科目']||r['account']||''}</td><td style="text-align:center">${r['附件张数']||r['attachments']||''}</td><td>${r.method}</td></tr>`);
  html+='</table>';
  document.getElementById('detailTable').innerHTML=html;
  document.getElementById('resultCard').style.display='block';document.getElementById('resultCard').scrollIntoView({behavior:'smooth'});
}

function exportExcel(){
  const method=document.querySelector('input[name=method]:checked').value;
  const n=parseInt(document.getElementById('sampleSize').value);
  let samples=[];
  // Re-run sampling for export
  const total=voucherData.reduce((s,r)=>s+(parseFloat(r['金额']||r['amount']||0)||0),0);
  const interval=total/n;
  if(method==='random'){
    const indices=[...Array(voucherData.length).keys()];
    for(let i=indices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[indices[i],indices[j]]=[indices[j],indices[i]]}
    samples=indices.slice(0,n).map(i=>({...voucherData[i]}));
  }else if(method==='top'){
    samples=[...voucherData].sort((a,b)=>(parseFloat(b['金额']||0)||0)-(parseFloat(a['金额']||0)||0)).slice(0,n);
  }else{let start=Math.random()*interval,acc=0;const used=new Set();voucherData.forEach((r,i)=>{acc+=(parseFloat(r['金额']||0)||0);if(acc>=start&&!used.has(i)){used.add(i);samples.push(r);start+=interval}});samples=samples.slice(0,n)}

  const wb=XLSX.utils.book_new();
  const metaData=[['审计抽凭工作底稿','','',''],['抽样方法：'+{'random':'随机抽样','mus':'货币单元抽样(MUS)','top':'大金额优先'}[method],'','',''],['总体数量：'+voucherData.length,'样本数量：'+samples.length,'',''],['总体金额：'+total.toFixed(2),'样本金额：'+samples.reduce((s,r)=>s+(parseFloat(r['金额']||0)||0),0).toFixed(2),'',''],['','','','']];
  const hData=[['凭证号','日期','摘要','科目','金额','附件张数','检查结论','备注']];
  const rows=samples.map(r=>[r['凭证号']||'',r['日期']||'',r['摘要']||'',r['科目']||'',parseFloat(r['金额']||0)||0,r['附件张数']||'确认','确认','']);
  const ws1=XLSX.utils.aoa_to_sheet([...metaData,...hData,...rows]);ws1['!cols']=[{wch:12},{wch:12},{wch:30},{wch:14},{wch:14},{wch:8},{wch:10},{wch:20}];XLSX.utils.book_append_sheet(wb,ws1,'抽样底稿');
  XLSX.writeFile(wb,'审计抽样底稿.xlsx');
}
</script>
</body>
</html>
